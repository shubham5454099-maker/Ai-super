<!DOCTYPE html>
<html>
<head>
  <title>AI SUPER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 10px;
      text-align: center;
      background: #020617;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .msg {
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      max-width: 75%;
      word-wrap: break-word;
    }

    .user {
      background: #38bdf8;
      color: black;
      margin-left: auto;
    }

    .ai {
      background: #1e293b;
    }

    img {
      border-radius: 10px;
      margin-top: 5px;
    }

    #inputBox {
      display: flex;
      padding: 10px;
      background: #020617;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      margin-left: 6px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>🤖 AI SUPER</header>

<div id="chat"></div>

<div id="inputBox">
  <input id="msg" placeholder="Type message..." />
  <button onclick="startVoice()">🎤</button>
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");

function addMessage(text, type) {
  chat.innerHTML += `<div class="msg ${type}">${text}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  // IMAGE MODE
  if (text.toLowerCase().includes("draw") || text.toLowerCase().includes("image")) {
    const res = await fetch("/api/image?prompt=" + encodeURIComponent(text));
    const data = await res.json();

    addMessage(`<img src="${data.image}" width="200"/>`, "ai");
    speak("Here is your image");
    return;
  }

  // CHAT MODE
  const res = await fetch("/api/chat?message=" + encodeURIComponent(text));
  const data = await res.json();

  addMessage(data.reply, "ai");
  speak(data.reply);
}

// VOICE INPUT
function startVoice() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";

  recognition.onresult = function(event) {
    document.getElementById("msg").value = event.results[0][0].transcript;
  };

  recognition.start();
}

// VOICE OUTPUT
function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
