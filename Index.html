<!DOCTYPE html>
<html>
<head>
  <title>AI Ultra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .msg {
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      max-width: 70%;
    }

    .user {
      background: #38bdf8;
      color: black;
      margin-left: auto;
    }

    .ai {
      background: #1e293b;
    }

    #inputBox {
      display: flex;
      padding: 10px;
      background: #020617;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      margin-left: 6px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="chat"></div>

<div id="inputBox">
  <input id="msg" placeholder="Type or speak..." />
  <button onclick="startVoice()">🎤</button>
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");

// SEND MESSAGE
async function send() {
  const input = document.getElementById("msg");
  const text = input.value;

  if (!text) return;

  chat.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = "";

  // IMAGE DETECT
  if (text.toLowerCase().includes("draw") || text.toLowerCase().includes("image")) {
    const res = await fetch("/api/image?prompt=" + encodeURIComponent(text));
    const data = await res.json();

    chat.innerHTML += `<div class="msg ai"><img src="${data.image}" width="200"/></div>`;
    speak("Here is your image");
    return;
  }

  // TEXT AI
  const res = await fetch("/api/chat?message=" + encodeURIComponent(text));
  const data = await res.json();

  chat.innerHTML += `<div class="msg ai">${data.reply}</div>`;
  speak(data.reply);
}

// VOICE INPUT
function startVoice() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";

  recognition.onresult = function(event) {
    document.getElementById("msg").value = event.results[0][0].transcript;
  };

  recognition.start();
}

// VOICE OUTPUT
function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  window.speechSynthesis.speak(speech);
}
</script>

</body>
  </html>
